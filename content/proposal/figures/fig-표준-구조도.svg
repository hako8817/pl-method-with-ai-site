<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    </style>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#adb5bd"/>
    </marker>
  </defs>

  <rect width="900" height="340" fill="#f8f9fa" rx="8"/>
  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">제안 실무 기준의 3층 구조</text>

  <rect x="80" y="62" width="520" height="62" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="340" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1864ab">1. 글로벌 베스트 프랙티스</text>
  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#1864ab">APMP 같은 국제적 참조 체계</text>

  <rect x="110" y="138" width="520" height="62" rx="10" fill="#fff4e6" stroke="#ffa94d" stroke-width="1.5"/>
  <text x="370" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05c00">2. 조달 규정과 제출 형식</text>
  <text x="370" y="184" text-anchor="middle" font-size="12" fill="#c05c00">고객 요구 형식, 평가 기준, 제출 조건</text>

  <rect x="140" y="214" width="520" height="62" rx="10" fill="#ebfbee" stroke="#8ce99a" stroke-width="1.5"/>
  <text x="400" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">3. 산업별 관행과 조직 경험</text>
  <text x="400" y="260" text-anchor="middle" font-size="12" fill="#2b8a3e">도메인 특성, 조직 언어, 축적된 실무 판단</text>

  <line x1="340" y1="124" x2="370" y2="138" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="370" y1="200" x2="400" y2="214" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="690" y="108" width="160" height="126" rx="10" fill="#fff3bf" stroke="#ffd43b" stroke-width="2"/>
  <text x="770" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c4400">실무 기준 형성</text>
  <text x="770" y="168" text-anchor="middle" font-size="12" fill="#795c00">세 층이 겹쳐서</text>
  <text x="770" y="186" text-anchor="middle" font-size="12" fill="#795c00">현실의 작성 기준을</text>
  <text x="770" y="204" text-anchor="middle" font-size="12" fill="#795c00">만든다</text>

  <line x1="600" y1="93" x2="690" y2="140" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="630" y1="169" x2="690" y2="171" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="660" y1="245" x2="690" y2="202" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="80" y="292" width="770" height="28" rx="6" fill="#e9ecef"/>
  <text x="465" y="311" text-anchor="middle" font-size="11" fill="#495057">단일 국제표준 하나로 설명되지 않고, 참조 체계와 고객 조건과 현장 경험이 함께 작동한다.</text>
</svg>
