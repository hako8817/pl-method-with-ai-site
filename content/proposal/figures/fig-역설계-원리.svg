<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320">
  <defs>
    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    </style>
    <!-- 순방향 화살표 (회색) -->
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#adb5bd"/>
    </marker>
    <!-- 역방향 화살표 (강조) -->
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d6be4"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="320" fill="#f8f9fa" rx="8"/>

  <!-- 제목 -->
  <text x="440" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">아웃풋 기준 역설계 — 제안서 설계 원리</text>

  <!-- ── 순방향 레이블 ── -->
  <text x="440" y="62" text-anchor="middle" font-size="11" fill="#868e96">← 설계 방향 (아웃풋에서 거꾸로)</text>

  <!-- 박스 1: RFP / 입력 -->
  <rect x="30" y="80" width="160" height="80" rx="8" fill="#e9ecef" stroke="#ced4da" stroke-width="1.5"/>
  <text x="110" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057">① RFP 분석</text>
  <text x="110" y="132" text-anchor="middle" font-size="11" fill="#6c757d">무엇을 읽어야 하는가</text>
  <text x="110" y="148" text-anchor="middle" font-size="11" fill="#6c757d">어떤 정보가 필요한가</text>

  <!-- 박스 2: 요구사항 구조화 -->
  <rect x="230" y="80" width="160" height="80" rx="8" fill="#dbe4ff" stroke="#91a7ff" stroke-width="1.5"/>
  <text x="310" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#364fc7">② 구조화</text>
  <text x="310" y="132" text-anchor="middle" font-size="11" fill="#4c6ef5">요구사항 분류</text>
  <text x="310" y="148" text-anchor="middle" font-size="11" fill="#4c6ef5">대응 메트릭스</text>

  <!-- 박스 3: 전략·목차 -->
  <rect x="430" y="80" width="160" height="80" rx="8" fill="#d3f9d8" stroke="#8ce99a" stroke-width="1.5"/>
  <text x="510" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">③ 전략·목차</text>
  <text x="510" y="132" text-anchor="middle" font-size="11" fill="#2f9e44">제안 메시지 설계</text>
  <text x="510" y="148" text-anchor="middle" font-size="11" fill="#2f9e44">설득 순서 구성</text>

  <!-- 박스 4: 좋은 제안서 (아웃풋) -->
  <rect x="630" y="68" width="200" height="104" rx="8" fill="#fff3bf" stroke="#ffd43b" stroke-width="2"/>
  <text x="730" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c4400">④ 좋은 제안서</text>
  <text x="730" y="128" text-anchor="middle" font-size="11" fill="#795c00">약속이 명확하고</text>
  <text x="730" y="144" text-anchor="middle" font-size="11" fill="#795c00">요구사항을 빠짐없이 대응</text>
  <text x="730" y="160" text-anchor="middle" font-size="11" fill="#795c00">착수로 연결 가능한 구조</text>

  <!-- 순방향 화살표 (실행 순서, 회색) -->
  <line x1="193" y1="120" x2="226" y2="120" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="393" y1="120" x2="426" y2="120" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="593" y1="120" x2="626" y2="120" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- 역방향 화살표 (설계 방향, 파랑) — 하단 -->
  <line x1="626" y1="210" x2="30" y2="210" stroke="#2d6be4" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- 역방향 연결선 (각 박스 하단에서 아래로) -->
  <line x1="110" y1="160" x2="110" y2="210" stroke="#2d6be4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="310" y1="160" x2="310" y2="210" stroke="#2d6be4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="510" y1="160" x2="510" y2="210" stroke="#2d6be4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="730" y1="172" x2="730" y2="210" stroke="#2d6be4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 역방향 레이블 -->
  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#2d6be4" font-weight="bold">설계는 아웃풋에서 거꾸로 — "어떤 입력이 있어야 이 제안서가 나오는가"</text>

  <!-- 하단 설명 -->
  <rect x="30" y="262" width="820" height="40" rx="6" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1"/>
  <text x="440" y="280" text-anchor="middle" font-size="11" fill="#1864ab">실행은 ①→②→③→④ 순서로 진행하지만,  설계 사고는 ④ 좋은 제안서의 기준에서 ①로 거슬러 올라가며 입력 조건을 정의한다.</text>
  <text x="440" y="296" text-anchor="middle" font-size="11" fill="#1864ab">AI는 각 단계의 초안과 구조화를 가속하지만, 역설계 판단(어떤 약속이 적절한가)은 사람이 한다.</text>
</svg>
