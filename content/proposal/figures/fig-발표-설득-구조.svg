<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <defs>
    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#adb5bd"/>
    </marker>
  </defs>

  <rect width="960" height="360" fill="#f8f9fa" rx="8"/>
  <text x="480" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">제안 발표 설득 흐름</text>
  <text x="480" y="56" text-anchor="middle" font-size="11" fill="#495057">핵심 메시지는 시작 1~2분 안에 먼저 전달한다</text>

  <rect x="30" y="88" width="132" height="126" rx="10" fill="#fff3bf" stroke="#ffd43b" stroke-width="2"/>
  <text x="96" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c4400">1. 오프닝</text>
  <text x="96" y="138" text-anchor="middle" font-size="11" fill="#795c00">1~2분</text>
  <text x="96" y="162" text-anchor="middle" font-size="11" fill="#795c00">핵심 메시지 3개</text>
  <text x="96" y="180" text-anchor="middle" font-size="11" fill="#795c00">먼저 선언</text>

  <rect x="182" y="88" width="132" height="126" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="248" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">2. 사업 이해</text>
  <text x="248" y="138" text-anchor="middle" font-size="11" fill="#1864ab">3~5분</text>
  <text x="248" y="162" text-anchor="middle" font-size="11" fill="#1864ab">왜 지금 이 사업인지</text>
  <text x="248" y="180" text-anchor="middle" font-size="11" fill="#1864ab">문제 정의 제시</text>

  <rect x="334" y="88" width="132" height="126" rx="10" fill="#dbe4ff" stroke="#91a7ff" stroke-width="1.5"/>
  <text x="400" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#364fc7">3. 핵심 대응</text>
  <text x="400" y="138" text-anchor="middle" font-size="11" fill="#364fc7">5~10분</text>
  <text x="400" y="162" text-anchor="middle" font-size="11" fill="#364fc7">요구사항 대응 방식</text>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="#364fc7">수행 방법론 설명</text>

  <rect x="486" y="88" width="132" height="126" rx="10" fill="#ebfbee" stroke="#8ce99a" stroke-width="1.5"/>
  <text x="552" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">4. 차별화</text>
  <text x="552" y="138" text-anchor="middle" font-size="11" fill="#2b8a3e">3~5분</text>
  <text x="552" y="162" text-anchor="middle" font-size="11" fill="#2b8a3e">경험과 레퍼런스</text>
  <text x="552" y="180" text-anchor="middle" font-size="11" fill="#2b8a3e">근거 중심 제시</text>

  <rect x="638" y="88" width="132" height="126" rx="10" fill="#fff4e6" stroke="#ffa94d" stroke-width="1.5"/>
  <text x="704" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05c00">5. 일정·조직</text>
  <text x="704" y="138" text-anchor="middle" font-size="11" fill="#c05c00">2~3분</text>
  <text x="704" y="162" text-anchor="middle" font-size="11" fill="#c05c00">안정감 있게</text>
  <text x="704" y="180" text-anchor="middle" font-size="11" fill="#c05c00">간결하게 제시</text>

  <rect x="790" y="88" width="132" height="126" rx="10" fill="#f3f0ff" stroke="#b197fc" stroke-width="1.5"/>
  <text x="856" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#6741d9">6. 클로징</text>
  <text x="856" y="138" text-anchor="middle" font-size="11" fill="#6741d9">1~2분</text>
  <text x="856" y="162" text-anchor="middle" font-size="11" fill="#6741d9">핵심 메시지</text>
  <text x="856" y="180" text-anchor="middle" font-size="11" fill="#6741d9">다시 강조</text>

  <line x1="162" y1="151" x2="182" y2="151" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="314" y1="151" x2="334" y2="151" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="466" y1="151" x2="486" y2="151" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="618" y1="151" x2="638" y2="151" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="770" y1="151" x2="790" y2="151" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="244" width="892" height="84" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="476" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#212529">발표 구조의 원칙</text>
  <text x="476" y="290" text-anchor="middle" font-size="11" fill="#495057">회사 소개나 목차 안내보다 먼저 사업 이해와 핵심 대응을 보여줘야 심사 초반 판단 구간을 놓치지 않는다.</text>
  <text x="476" y="308" text-anchor="middle" font-size="11" fill="#495057">차별화와 일정·조직은 주장보다 근거와 안정감을 주는 방식으로 배치하고, 마지막에 핵심 메시지를 다시 묶는다.</text>
</svg>
