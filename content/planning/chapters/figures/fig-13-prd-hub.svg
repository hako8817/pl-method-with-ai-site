  <line x1="680" y1="500" x2="430" y2="610" stroke="#35543a" stroke-width="3.5" marker-end="url(#arrow13)"/>
  <line x1="800" y1="500" x2="800" y2="650" stroke="#35543a" stroke-width="3.5" marker-end="url(#arrow13)"/>
  <line x1="920" y1="500" x2="1130" y2="610" stroke="#35543a" stroke-width="3.5" marker-end="url(#arrow13)"/>
