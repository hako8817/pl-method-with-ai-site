  </defs>
  <rect width="1600" height="900" fill="#f7f5ef"/>
  <text x="90" y="90" class="title">PRD 허브 구조</text>
  <text x="90" y="126" class="subtitle">좋은 PRD는 모든 내용을 혼자 품는 문서가 아니라 다음 산출물로 분기시키는 허브 문서다.</text>

  <rect x="620" y="280" width="360" height="220" rx="28" class="hub"/>
