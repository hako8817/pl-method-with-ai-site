  <text x="260" y="232" text-anchor="middle" class="body">규칙 / 예외</text>

  <rect x="480" y="120" width="210" height="96" rx="18" class="out"/>
  <text x="585" y="165" text-anchor="middle" class="head">BPMN</text>
  <text x="585" y="192" text-anchor="middle" class="body">흐름 / 역할 / 분기</text>

  <rect x="860" y="120" width="210" height="96" rx="18" class="out"/>
  <text x="965" y="165" text-anchor="middle" class="head">DMN</text>
