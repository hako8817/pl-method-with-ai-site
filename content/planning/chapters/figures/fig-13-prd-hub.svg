  <text x="1255" y="232" text-anchor="middle" class="body">구현 조건</text>

  <rect x="250" y="610" width="220" height="96" rx="18" class="out"/>
  <text x="360" y="655" text-anchor="middle" class="head">프로토타입</text>
  <text x="360" y="682" text-anchor="middle" class="body">경험 검증</text>

  <rect x="690" y="650" width="220" height="96" rx="18" class="accent"/>
