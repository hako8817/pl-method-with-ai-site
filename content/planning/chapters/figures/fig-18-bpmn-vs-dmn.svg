<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#384d7a"/>
    </marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#22313a}
      .subtitle{font:500 20px Arial,sans-serif;fill:#58666e}
      .head{font:700 22px Arial,sans-serif;fill:#22313a}
      .body{font:500 16px Arial,sans-serif;fill:#58666e}
      .small{font:500 14px Arial,sans-serif;fill:#7b8790}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f5ef"/>
  <text x="90" y="90" class="title">BPMN과 DMN의 역할 분리</text>
  <text x="90" y="126" class="subtitle">흐름은 BPMN으로, 판단은 DMN으로 분리해야 누락과 해석 차이를 줄일 수 있다.</text>

  <rect x="90" y="180" width="690" height="560" rx="24" fill="#ffffff" stroke="#384d7a" stroke-width="3"/>
  <text x="120" y="225" class="head">BPMN: 흐름과 책임</text>
  <text x="120" y="255" class="body">무엇이 어떤 순서로 흘러가고 어디서 분기되는가</text>

  <rect x="130" y="320" width="160" height="74" rx="14" fill="#eef3ff" stroke="#384d7a" stroke-width="2.5"/>
  <text x="178" y="364" class="body">로그인 시도</text>
  <rect x="350" y="320" width="160" height="74" rx="14" fill="#eef3ff" stroke="#384d7a" stroke-width="2.5"/>
  <text x="404" y="364" class="body">인증 요청</text>
  <circle cx="610" cy="357" r="48" fill="#eef3ff" stroke="#384d7a" stroke-width="2.5"/>
  <text x="579" y="350" class="body">로그인</text>
  <text x="585" y="372" class="body">판단점</text>
  <rect x="510" y="495" width="160" height="74" rx="14" fill="#eef3ff" stroke="#384d7a" stroke-width="2.5"/>
  <text x="555" y="539" class="body">정상 로그인</text>
  <rect x="635" y="320" width="120" height="220" rx="18" fill="#f8fbff" stroke="#8ea0c7" stroke-width="2.5"/>
  <text x="675" y="365" class="body">운영</text>
  <text x="668" y="397" class="body">알림</text>
  <text x="667" y="429" class="body">잠금</text>
  <text x="661" y="461" class="body">해제</text>

  <line x1="290" y1="357" x2="350" y2="357" stroke="#384d7a" stroke-width="4" marker-end="url(#arrow18)"/>
  <line x1="510" y1="357" x2="562" y2="357" stroke="#384d7a" stroke-width="4" marker-end="url(#arrow18)"/>
  <line x1="610" y1="405" x2="590" y2="495" stroke="#384d7a" stroke-width="4" marker-end="url(#arrow18)"/>
  <line x1="680" y1="380" x2="716" y2="380" stroke="#384d7a" stroke-width="4" marker-end="url(#arrow18)"/>

  <text x="130" y="635" class="body">BPMN이 답하는 질문</text>
  <text x="130" y="665" class="body">- 어디서 시작하고 어디로 가는가</text>
  <text x="130" y="693" class="body">- 누가 어떤 책임을 갖는가</text>
  <text x="130" y="721" class="body">- 예외가 발생하면 어느 경로로 빠지는가</text>

  <rect x="840" y="180" width="670" height="560" rx="24" fill="#ffffff" stroke="#7f4f24" stroke-width="3"/>
  <text x="870" y="225" class="head" fill="#6f441f">DMN: 판단 규칙</text>
  <text x="870" y="255" class="body" fill="#8b5f33">조건 조합이 바뀌면 어떤 결과가 나오는가</text>

  <rect x="890" y="320" width="560" height="230" rx="18" fill="#fff9f2" stroke="#c3833d" stroke-width="2.5"/>
  <line x1="890" y1="385" x2="1450" y2="385" stroke="#c3833d" stroke-width="2"/>
  <line x1="1040" y1="320" x2="1040" y2="550" stroke="#c3833d" stroke-width="2"/>
  <line x1="1180" y1="320" x2="1180" y2="550" stroke="#c3833d" stroke-width="2"/>
  <line x1="1310" y1="320" x2="1310" y2="550" stroke="#c3833d" stroke-width="2"/>
  <line x1="890" y1="440" x2="1450" y2="440" stroke="#e0b27d" stroke-width="1.5"/>
  <line x1="890" y1="495" x2="1450" y2="495" stroke="#e0b27d" stroke-width="1.5"/>
  <text x="925" y="360" class="body" fill="#6f441f">계정 상태</text>
  <text x="1076" y="360" class="body" fill="#6f441f">실패 횟수</text>
  <text x="1210" y="360" class="body" fill="#6f441f">본인확인</text>
  <text x="1350" y="360" class="body" fill="#6f441f">결과</text>
  <text x="930" y="420" class="body">정상</text>
  <text x="1086" y="420" class="body">0-4</text>
  <text x="1216" y="420" class="body">성공</text>
  <text x="1354" y="420" class="body">로그인 허용</text>
  <text x="930" y="475" class="body">정상</text>
  <text x="1089" y="475" class="body">5+</text>
  <text x="1213" y="475" class="body">무관</text>
  <text x="1364" y="475" class="body">잠금</text>
  <text x="930" y="530" class="body">예외</text>
  <text x="1089" y="530" class="body">무관</text>
  <text x="1213" y="530" class="body">실패</text>
  <text x="1340" y="530" class="body">추가 인증</text>

  <line x1="610" y1="430" x2="840" y2="430" stroke="#a36a2e" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow18)"/>
  <text x="660" y="413" class="body" fill="#8b5f33">판단 규칙 참조</text>

  <text x="890" y="635" class="body" fill="#6f441f">DMN이 답하는 질문</text>
  <text x="890" y="665" class="body" fill="#6f441f">- 어떤 입력 조건 조합이 있는가</text>
  <text x="890" y="693" class="body" fill="#6f441f">- 각 조건 조합의 결과는 무엇인가</text>
  <text x="890" y="721" class="body" fill="#6f441f">- 규칙이 바뀌면 어떤 행이 바뀌는가</text>
</svg>



